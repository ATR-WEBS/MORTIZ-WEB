<!--
  Sillar: hiladas de piedra a juntas encontradas. Se repite sobre el degradado
  del muro. Solo dibuja las juntas (fondo transparente) y con muy poco contraste;
  si se marca mas parece ladrillo de dibujo animado en vez de piedra.
  Cada junta lleva su linea oscura y, debajo, un filo claro que le da el relieve.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 130" width="260" height="130">
  <g stroke="#000000" stroke-opacity=".5" stroke-width="1.6">
    <!-- juntas horizontales -->
    <path d="M0,0.8H260M0,65.8H260"/>
    <!-- juntas verticales, encontradas de una hilada a la otra -->
    <path d="M0.8,0V65M130.8,0V65"/>
    <path d="M65.8,65V130M195.8,65V130"/>
  </g>
  <g stroke="#8fa0cc" stroke-opacity=".05" stroke-width="1.2">
    <path d="M0,2.4H260M0,67.4H260"/>
    <path d="M2.4,0V65M132.4,0V65"/>
    <path d="M67.4,65V130M197.4,65V130"/>
  </g>
</svg>
