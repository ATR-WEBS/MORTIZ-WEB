<!--
  Tramo de cadena vertical. Argolla arriba (se clava en el canto del marco) y
  argolla abajo (sujeta el cartel). Va sin estirar: estirada, los eslabones se
  deforman. La posicion la pone el CSS en % del ancho del cartel.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 68" width="14" height="68">
    <g fill="none" stroke="#090b12" stroke-width="2.4" opacity=".5"
       transform="translate(1.1 1.4)">
        <ellipse cx="7" cy="12.0" rx="4.4" ry="2.7"/>
        <ellipse cx="7" cy="19.2" rx="1.2" ry="2.7"/>
        <ellipse cx="7" cy="26.4" rx="4.4" ry="2.7"/>
        <ellipse cx="7" cy="33.6" rx="1.2" ry="2.7"/>
        <ellipse cx="7" cy="40.8" rx="4.4" ry="2.7"/>
        <ellipse cx="7" cy="48.0" rx="1.2" ry="2.7"/>
        <ellipse cx="7" cy="55.2" rx="4.4" ry="2.7"/>
    </g>
    <g fill="none" stroke="#1d2130" stroke-width="2">
        <ellipse cx="7" cy="12.0" rx="4.4" ry="2.7"/>
        <ellipse cx="7" cy="19.2" rx="1.2" ry="2.7"/>
        <ellipse cx="7" cy="26.4" rx="4.4" ry="2.7"/>
        <ellipse cx="7" cy="33.6" rx="1.2" ry="2.7"/>
        <ellipse cx="7" cy="40.8" rx="4.4" ry="2.7"/>
        <ellipse cx="7" cy="48.0" rx="1.2" ry="2.7"/>
        <ellipse cx="7" cy="55.2" rx="4.4" ry="2.7"/>
    </g>
    <g fill="none" stroke="#4b5470" stroke-width="0.6" opacity=".45"
       transform="translate(-0.5 -0.5)">
        <ellipse cx="7" cy="12.0" rx="4.4" ry="2.7"/>
        <ellipse cx="7" cy="19.2" rx="1.2" ry="2.7"/>
        <ellipse cx="7" cy="26.4" rx="4.4" ry="2.7"/>
        <ellipse cx="7" cy="33.6" rx="1.2" ry="2.7"/>
        <ellipse cx="7" cy="40.8" rx="4.4" ry="2.7"/>
        <ellipse cx="7" cy="48.0" rx="1.2" ry="2.7"/>
        <ellipse cx="7" cy="55.2" rx="4.4" ry="2.7"/>
    </g>

    <!-- argolla de arriba, hincada en el canto del marco -->
    <circle cx="7" cy="5" r="3.9" fill="none" stroke="#090b12" stroke-width="3.4"/>
    <circle cx="7" cy="5" r="3.9" fill="none" stroke="#1d2130" stroke-width="2.2"/>
    <circle cx="5.5" cy="3.2" r="1.2" fill="#4b5470" opacity=".7"/>
    <!-- argolla de abajo, sujeta el cartel -->
    <circle cx="7" cy="63.5" r="3.6" fill="none" stroke="#090b12" stroke-width="3.4"/>
    <circle cx="7" cy="63.5" r="3.6" fill="none" stroke="#1d2130" stroke-width="2.2"/>
</svg>
