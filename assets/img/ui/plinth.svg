<!--
  Zocalo del muro: la moldura que vuela y la hilada de base.
  Cierra el muro por abajo igual que el pretil lo cierra por arriba.
  Se repite en horizontal; la moldura es continua, asi que no hay costura.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 118" width="320" height="118">
    <defs>
        <linearGradient id="z-m" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1c2338"/>
            <stop offset=".45" stop-color="#121727"/>
            <stop offset="1" stop-color="#0a0d18"/>
        </linearGradient>
    </defs>
    <rect width="320" height="118" fill="#080b14"/>
    <g>
        <path d="M1.6,23L152.7,23.8L152.7,118L1.6,118Z" fill="#0c101d"/>
        <path d="M155.9,23L318.4,21.7L318.4,118L155.9,118Z" fill="#101423"/>
    </g>
    <!-- moldura: vuela sobre la hilada y por eso le echa sombra encima -->
    <rect x="0" y="0" width="320" height="20" fill="url(#z-m)"/>
    <rect x="0" y="0" width="320" height="2" fill="#2a3352" opacity=".45"/>
    <rect x="0" y="20" width="320" height="5" fill="#04050b" opacity=".8"/>
</svg>
