<!--
  Cordon del que cuelga cada cuadro, con su clavo arriba.
  Se estira al ancho que le de el CSS (preserveAspectRatio="none"), asi que los
  cordones caen siempre a la misma proporcion del marco, mida lo que mida.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 34" preserveAspectRatio="none">
  <g fill="none" stroke="#5e4b14" stroke-width="1.4" stroke-linecap="round">
    <path d="M50,7L4,34"/>
    <path d="M50,7L96,34"/>
  </g>
  <circle cx="50" cy="5" r="3.4" fill="#2b2313"/>
  <circle cx="50" cy="4.2" r="2.2" fill="#7a6220"/>
  <circle cx="49.2" cy="3.4" r="0.9" fill="#a7924f"/>
</svg>
