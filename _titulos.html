<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mortiz · pruebas de titulo</title>
<style>
@font-face {
    font-family: "Cardo";
    src: url("assets/fonts/cardo-400.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
}
@font-face {
    font-family: "Cardo";
    src: url("assets/fonts/cardo-700.woff2") format("woff2");
    font-weight: 700;
    font-style: normal;
}
@font-face {
    font-family: "Cinzel";
    src: url("assets/fonts/cinzel.woff2") format("woff2");
    font-weight: 400 700;
    font-style: normal;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    background: #04050b;
    color: #cfc6b4;
    font-family: "Cardo", Georgia, serif;
}

.muestra {
    position: relative;
    padding: 86px 24px 92px;
    text-align: center;
    background-color: #070a13;
    background-image: radial-gradient(96% 74% at 84% -4%, rgb(104 120 186 / 0.15), transparent 64%),
        url("assets/img/ui/wall.svg"),
        linear-gradient(180deg, #0c1020 0, #090c17 32%, #06080f 72%, #04050b 100%);
    background-size: auto, 760px 390px, auto;
    background-repeat: no-repeat, repeat, no-repeat;
}

.etiqueta {
    position: absolute;
    top: 14px;
    left: 18px;
    font-family: "Cinzel", serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #7e6a45;
}

h2 { margin: 0; }

.a h2 {
    font-family: "Cardo", serif;
    font-size: 46px;
    font-weight: 900;
    letter-spacing: 1.1px;
    text-transform: uppercase;
    color: #cfc6b4;
    text-shadow: 0 1px 2px rgb(2 2 6 / 0.9), 0 0 14px rgb(2 2 6 / 0.8);
}

.b h2 {
    font-family: "Cinzel", serif;
    font-size: 46px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-indent: 0.14em;
    text-transform: uppercase;
    color: #4a5062;
    text-shadow:
        0 -1px 0 rgb(206 196 176 / 0.30),
        0 2px 2px rgb(0 0 0 / 0.80);
}

.c h2 {
    font-family: "Cinzel", serif;
    font-size: 46px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-indent: 0.14em;
    text-transform: uppercase;
    color: #070a12;
    text-shadow:
        0 -1px 1px rgb(0 0 0 / 0.55),
        0 2px 0 rgb(198 188 168 / 0.34),
        0 3px 3px rgb(0 0 0 / 0.42);
}

.d h2 {
    font-family: "Cinzel", serif;
    font-size: 46px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-indent: 0.14em;
    text-transform: uppercase;
    background: linear-gradient(176deg, #f0d79a 0%, #c79a4e 34%, #8a6b23 62%, #5b4415 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    filter:
        drop-shadow(0 -1px 0 rgb(0 0 0 / 0.95))
        drop-shadow(0 2px 3px rgb(0 0 0 / 0.75));
}

.e {
    padding-top: 0;
    padding-bottom: 0;
}

.e .nicho {
    position: relative;
    padding: 84px 24px 88px;
    background-image:
        radial-gradient(120% 140% at 50% 0%, rgb(190 170 130 / 0.14), transparent 62%),
        linear-gradient(180deg, rgb(255 244 214 / 0.07), transparent 58%);
    box-shadow:
        inset 0 3px 8px rgb(0 0 0 / 0.75),
        inset 0 -2px 0 rgb(206 196 176 / 0.10);
}

.e h2 {
    font-family: "Cinzel", serif;
    font-size: 46px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-indent: 0.14em;
    text-transform: uppercase;
    color: #14192a;
    text-shadow:
        0 -1px 1px rgb(0 0 0 / 0.75),
        0 2px 0 rgb(214 204 184 / 0.42);
}

.f h2 {
    font-family: "Cinzel", serif;
    font-size: 46px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-indent: 0.14em;
    text-transform: uppercase;
    color: #2a3043;
    text-shadow:
        0 -1px 0 rgb(0 0 0 / 0.9),
        0 -2px 3px rgb(0 0 0 / 0.5),
        0 1px 0 rgb(176 166 148 / 0.26),
        0 2px 4px rgb(0 0 0 / 0.4);
}
</style>
</head>
<body>

<section class="muestra a">
    <span class="etiqueta">A &middot; actual</span>
    <h2>Espejos y Marcos</h2>
</section>

<section class="muestra b">
    <span class="etiqueta">B &middot; bajorrelieve</span>
    <h2>Espejos y Marcos</h2>
</section>

<section class="muestra c">
    <span class="etiqueta">C &middot; incisa profunda</span>
    <h2>Espejos y Marcos</h2>
</section>

<section class="muestra d">
    <span class="etiqueta">D &middot; bronce embutido</span>
    <h2>Espejos y Marcos</h2>
</section>

<section class="muestra e">
    <span class="etiqueta">E &middot; hornacina iluminada</span>
    <div class="nicho">
        <h2>Espejos y Marcos</h2>
    </div>
</section>

<section class="muestra f">
    <span class="etiqueta">F &middot; incisa suave</span>
    <h2>Espejos y Marcos</h2>
</section>

</body>
</html>
